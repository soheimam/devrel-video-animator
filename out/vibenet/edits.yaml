# Vibenet walkthrough, eval round 1: storyboard re-timed to the real narration.
# Source-video time; design px (1662x1080 = source px × 1.5). Webcam bubble: {1062,722,600,358}.
# Word times come from a segment-level transcript spread evenly (±1s); see transcript.json note.
video: vibetnet.mp4

objectives:
  - "Know what Vibenet is: Base's experimental preview network, where hard fork features land first"
  - "Know how to test your app on Vibenet and what to look for"
  - "Know the demos (EIP-8130 Accounts, B20, Validity Transactions) and where to report what breaks"

captions:
  burn: true
  avoid: { x: 1062, y: 722, w: 600, h: 358 }

cuts:
  - id: cut-1
    from: 00:00.0
    to: 00:00.6
    kind: dead-air
    reason: "Silent lead-in; first word at 0.9."
  - id: cut-2
    from: 00:47.8
    to: 00:50.0
    kind: dead-air
    reason: "3.3s pause after 'later in October' on a static screen, kept to ~1.1s."
  - id: cut-3
    from: 01:15.4
    to: 01:18.7
    kind: dead-air
    reason: "4.3s thinking pause mid-sentence ('how does it … work'), kept to ~1s so the sentence joins."
  - id: cut-4
    from: 02:35.8
    to: 02:37.46
    kind: dead-air
    reason: "After 'Bye' and the wave: reaching to stop the recorder."

cues:
  - id: beat-1
    at: 00:03.8                      # "Base hard forks" ~0:04
    duration: 5.6s
    template: term-definition
    params:
      term: "Base hard forks"
      gloss: "What changes for your app, and how early you can test"
    gap: said-once-then-gone
    objective: 1
    rationale: "The framing of the whole video, in her own words (0:10–0:18), shown as she names the topic."

  - id: beat-2
    at: 00:26.5                      # "Vibenet is Base's experimental preview network" ~0:27–0:29
    duration: 5s
    template: term-definition
    params:
      term: "Vibenet"
      gloss: "Base's experimental preview network"
    gap: said-once-then-gone
    objective: 1
    rationale: "The definition, quoted from the narration, at the moment it is given."

  - id: beat-3
    at: 00:31.5                      # "go live here first… weeks before Sepolia or Mainnet" (Sepolia 0:36.8, Mainnet 0:37.5)
    duration: 8s
    template: flow-diagram
    params:
      title: "New hard fork features go live"
      nodes:
        - "Vibenet"
        - { label: "Sepolia", at: 00:36.6 }
        - { label: "Mainnet", at: 00:37.3 }
    anchor: { x: 560, y: 56 }
    gap: said-not-shown
    objective: 1
    rationale: "She describes the order in words over a static page. Nodes appear on 'Sepolia' and 'Mainnet'. Over the browser chrome, where nothing is lost."

  - id: beat-4
    at: 00:39.8                      # "200 millisecond blocks… running on Vibenet today, while Sepolia is planned for later in October"
    duration: 8s
    template: comparison
    params:
      left: { title: "Vibenet", items: ["200 ms blocks: live today"] }
      right: { title: "Sepolia", items: ["200 ms blocks: later in October"], at: 00:44.0 }
    anchor: { x: 620, y: 50 }
    gap: relationship-not-visible
    objective: 1
    rationale: "Her concrete example is a contrast between two networks; the right column appears when she gets to Sepolia. Ends exactly at cut-2."

  - id: beat-5
    at: 00:55.0                      # "point it at Vibenet" 0:55.6
    duration: 9s
    template: step-list
    params:
      title: "Point your app at Vibenet"
      steps:
        - "Chain ID 84538453"
        - "RPC rpc.vibes.base.org"
        - "Test funds: Faucet (sidebar)"
    anchor: { x: 1050, y: 440 }
    source: screen
    gap: said-not-shown
    objective: 2
    rationale: "She says to point your app at Vibenet; the values you need are 14 px text in the Connect panel. Quoted from the screen."

  - id: beat-6
    at: 01:06.0                      # "timing assumptions" 1:06.7, "RPC responses" ~1:08, "gaps or even events" ~1:09.5
    duration: 8.5s
    template: step-list
    params:
      title: "Look for"
      steps:
        - { text: "Timing assumptions", at: 01:06.5 }
        - { text: "RPC responses", at: 01:07.9 }
        - { text: "Gaps or missing events", at: 01:09.4 }
    anchor: { x: 1050, y: 440 }
    gap: said-once-then-gone
    objective: 2
    rationale: "A checklist spoken quickly over a static page; the list builds on each item and stays up while she finishes the thought."

  - id: beat-7
    at: 01:45.5                      # "EIP-8130… click on Accounts" 1:46–1:50; cursor on the Accounts card
    duration: 4s
    template: callout
    params:
      text: "EIP-8130 · Accounts"
    anchor: { x: 522, y: 429 }
    gap: shown-not-findable
    objective: 3
    rationale: "She says the EIP number and tells viewers to click Accounts; the callout ties the two together on the card she is pointing at."

  - id: beat-8
    at: 01:52.8                      # "If you are working with B20" ~1:54; must end before the recorder's zoom at 1:56.3
    duration: 3.4s
    template: term-definition
    params:
      term: "B20"
      gloss: "Base's enshrined, ERC-20-compatible token standard"
    anchor: { x: 420, y: 360 }
    gap: said-once-then-gone
    objective: 3
    rationale: "B20 is named but never defined aloud; the gloss is the Tokens card's own wording."

  - id: beat-9
    at: 02:00.2                      # Create Token button visible 2:00–2:02; "deploy test tokens for B20" ~2:03
    duration: 1.6s
    template: highlight-region
    params:
      region: { x: 900, y: 858, w: 135, h: 39 }
    gap: shown-not-findable
    objective: 3
    rationale: "The button for the thing she says you can do. Short, because the page scrolls back up at 2:02 (a second before she says it)."

  - id: beat-10
    at: 02:11.0                      # "going live on Cobalt" ends 2:12.4
    duration: 2s
    template: highlight-region
    params:
      region: { x: 428, y: 462, w: 194, h: 28 }
    gap: shown-not-findable
    objective: 3
    rationale: "'Coming soon in Base Cobalt' is 12 px text; outlined as she says Cobalt."

  - id: beat-11
    at: 02:13.5                      # the 6.8s pause after 'Cobalt'
    duration: 6s
    template: flow-diagram
    params:
      direction: down
      nodes:
        - "Sign tx + conditions"
        - { label: "Sequencer checks them", at: 02:15.1 }
        - { label: "Included only while valid", at: 02:16.7 }
    anchor: { x: 990, y: 300 }
    gap: said-not-shown
    objective: 3
    rationale: "Validity transactions are named but not explained; the page explains them in one sentence. Drawn in the pause, between the description and the grid."

  - id: beat-12
    at: 02:21.3                      # "tell us in our Base Discord. Include your transaction hash (2:24), what you expected (2:25), and the exact error (2:26)"
    duration: 8s
    template: step-list
    params:
      title: "Hit something? Base Discord"
      steps:
        - { text: "Your transaction hash", at: 02:23.9 }
        - { text: "What you expected", at: 02:25.0 }
        - { text: "The exact error", at: 02:26.2 }
    anchor: { x: 430, y: 500 }
    gap: said-once-then-gone
    objective: 3
    rationale: "The feedback channel and the three things to include are spoken once and never shown. Each line lands on its word."

  - id: beat-13
    at: 02:30.3                      # "test early, tell us what breaks, and be ready for day one" 2:31–2:34
    duration: 5s
    template: term-definition
    params:
      term: "Test early. Tell us what breaks."
      gloss: "Be ready for day one"
    gap: said-once-then-gone
    objective: 3
    rationale: "Her closing line, as the sign-off card."

rejected:
  - id: cand-tagline-zoom
    kind: cue
    summary: "Zoom on the tagline at 0:22"
    rule: "Largest text on the page, cursor already on it."
  - id: cand-200ms-callout
    kind: cue
    summary: "Callout '200 ms blocks' on the Accounts bullet at 1:46 (round 0 beat 4)"
    rule: "She talks about 200 ms blocks at 0:40, not at 1:46; moved the fact to beat-4 where it is said."
  - id: cand-connect-at-1-06
    kind: cue
    summary: "Connect step-list at 1:06 (round 0 guess)"
    rule: "She says 'point it at Vibenet' at 0:55; moved there (beat-5)."
  - id: cand-tokens-grid-zoom
    kind: cue
    summary: "Zoom on the Tokens feature grid at 2:02"
    rule: "The recorder already zooms there at 1:56–2:00."
  - id: cand-validity-silence-cut
    kind: cut
    summary: "Cut the 6.8s pause at 2:12–2:19"
    rule: "beat-11 plays there; it becomes reading time."
