# Vibenet walkthrough, eval round 4: re-run against editorial/STYLE.md and MOTION.md.
# Source-video time; design px (1662x1080 = source px × 1.5). Webcam bubble: {1062,722,600,358}.
# `at` is the word's time; the renderer leads every cue and reveal by 0.25s (lib/rules.js).
# Word times come from a segment-level transcript spread evenly (±1s); see transcript.json note.
video: vibetnet.mp4

objectives:
  - "Know what Vibenet is: Base's experimental preview network, where hard fork features land first"
  - "Know how to test your app on Vibenet and what to look for"
  - "Know the demos (EIP-8130 Accounts, B20, Validity Transactions) and where to report what breaks"

captions:
  burn: true
  avoid: { x: 1062, y: 722, w: 600, h: 358 }

cuts:
  - id: cut-1
    from: 00:00.0
    to: 00:00.6
    kind: dead-air
    reason: "Silent lead-in; first word at 0.9."
  - id: cut-2
    from: 02:35.8
    to: 02:37.46
    kind: dead-air
    reason: "After 'Bye' and the wave: reaching to stop the recorder."

cues:
  - id: beat-1
    at: 00:04.0                      # "Base hard forks"
    duration: 5.6s
    template: term-definition
    params:
      term: "Base hard forks"
      gloss: "What changes for your app, and how early you can test"
    gap: said-once-then-gone
    objective: 1
    rationale: "The framing of the whole video, in her own words (0:10–0:18), shown as she names the topic."

  - id: beat-2
    at: 00:26.8                      # "Vibenet is Base's experimental preview network"
    duration: 5s
    template: term-definition
    params:
      term: "Vibenet"
      gloss: "Base's experimental preview network"
    gap: said-once-then-gone
    objective: 1
    rationale: "The definition, quoted from the narration, at the moment it is given."

  - id: beat-3
    at: 00:31.8                      # "go live here first… weeks before they even reach Sepolia or Mainnet"
    duration: 8s
    template: slide
    params:
      title: "Hard fork features go live"
      columns:
        - heading: "Vibenet"
          pill: "FIRST"
          lines: ["Weeks ahead"]
        - heading: "Sepolia"
          lines: ["Testnet, next"]
          at: 00:36.8
        - heading: "Mainnet"
          lines: ["Last"]
          at: 00:37.5
      summary: "VIBENET → SEPOLIA → MAINNET"
    gap: said-not-shown
    objective: 1
    rationale: "She describes the order in words over a static page. STYLE.md: an idea that needs a diagram gets a slide, in the style of reference 1 (three numbered steps, one pill, a takeaway line). Columns land on 'Sepolia' and 'Mainnet'; the takeaway lands last. Replaces the round-3 flow overlay that sat against the browser chrome."

  - id: beat-4
    at: 00:40.1                      # "200 millisecond blocks… running on Vibenet today, while Sepolia is planned for later in October"
    duration: 8s
    template: comparison
    params:
      left: { title: "Vibenet", items: ["200 ms blocks: live today"] }
      right: { title: "Sepolia", items: ["200 ms blocks: later in October"], at: 00:44.3 }
    anchor: { x: 620, y: 50 }
    gap: relationship-not-visible
    objective: 1
    rationale: "Her concrete example is a contrast between two networks; the right column appears when she gets to Sepolia. Ends exactly at cut-2."

  - id: beat-5
    at: 00:55.6                      # "point it at Vibenet"
    duration: 9s
    template: step-list
    params:
      title: "Point your app at Vibenet"
      steps:
        - "Chain ID 84538453"
        - "RPC rpc.vibes.base.org"
        - "Test funds: Faucet (sidebar)"
    anchor: { x: 1050, y: 440 }
    source: screen
    gap: said-not-shown
    objective: 2
    rationale: "She says to point your app at Vibenet; the values you need are 14 px text in the Connect panel. Quoted from the screen."

  - id: beat-6
    at: 01:06.3                      # "look for timing assumptions…"
    duration: 8.5s
    template: step-list
    params:
      title: "Look for"
      steps:
        - { text: "Timing assumptions", at: 01:06.7 }
        - { text: "RPC responses", at: 01:08.1 }
        - { text: "Gaps or missing events", at: 01:09.6 }
    anchor: { x: 1050, y: 440 }
    gap: said-once-then-gone
    objective: 2
    rationale: "A checklist spoken quickly over a static page; the list builds on each item and stays up while she finishes the thought."

  - id: beat-7
    at: 01:46.1                      # "EIP-8130"; cursor is on the Accounts card
    duration: 4s
    template: callout
    params:
      text: "EIP-8130 · Accounts"
    anchor: { x: 522, y: 429 }
    gap: shown-not-findable
    objective: 3
    rationale: "She says the EIP number and tells viewers to click Accounts; the callout ties the two together on the card she is pointing at."

  - id: beat-8
    at: 01:53.0                      # "If you are working with B20"; must end before the recorder's zoom at 1:56.3
    duration: 3.4s
    template: term-definition
    params:
      term: "B20"
      gloss: "Base's enshrined, ERC-20-compatible token standard"
    anchor: { x: 420, y: 360 }
    gap: said-once-then-gone
    objective: 3
    rationale: "B20 is named but never defined aloud; the gloss is the Tokens card's own wording."

  - id: beat-9
    at: 02:00.4                      # Create Token button visible 2:00–2:02; "deploy test tokens for B20" ~2:03
    duration: 1.6s
    template: highlight-region
    params:
      region: { x: 900, y: 858, w: 135, h: 39 }
    gap: shown-not-findable
    objective: 3
    rationale: "The button for the thing she says you can do. Short, because the page scrolls back up at 2:02 (a second before she says it)."

  - id: beat-11
    at: 02:12.0                      # "Cobalt", then the 6.7s pause (2:12.4–2:19.1)
    duration: 7.2s
    template: slide
    params:
      title: "Validity Transactions"
      columns:
        - heading: "Sign & send"
          pill: "Tx + conditions"
        - heading: "Sequencer checks"
          lines: ["Included while conditions hold"]
          at: 02:14.4
        - heading: "Otherwise"
          pill: "EXPIRES"
          at: 02:16.6
      summary: "SIGN → CHECK → INCLUDE"
    gap: said-not-shown
    objective: 3
    rationale: "Validity transactions are named but never explained; the page explains them in one sentence. A full-frame slide in the Base style fills the pause (STYLE.md: use a slide when the idea needs a diagram), with the bracketed takeaway from reference 3. Wording from the page: description, 'Block Bounds & Expiry', 'No Keeper Required'. Ends with the pause, so nothing hangs."

  - id: beat-12
    at: 02:21.6                      # "tell us in our Base Discord…"
    duration: 8s
    template: step-list
    params:
      title: "Hit something? Base Discord"
      steps:
        - { text: "Your transaction hash", at: 02:24.1 }
        - { text: "What you expected", at: 02:25.2 }
        - { text: "The exact error", at: 02:26.4 }
    anchor: { x: 430, y: 500 }
    gap: said-once-then-gone
    objective: 3
    rationale: "The feedback channel and the three things to include are spoken once and never shown. Each line lands on its word."

  - id: beat-13
    at: 02:30.6                      # "test early, tell us what breaks, and be ready for day one"
    duration: 5s
    template: term-definition
    params:
      term: "Test early. Tell us what breaks."
      gloss: "Be ready for day one"
    gap: said-once-then-gone
    objective: 3
    rationale: "Her closing line, as the sign-off card."

rejected:
  - id: beat-3-overlay
    kind: cue
    summary: "Vibenet → Sepolia → Mainnet as a flow overlay over the browser chrome (rounds 2–3)"
    rule: "Superseded by the beat-3 slide: STYLE.md prefers a slide when the idea needs a diagram, and the overlay was cramped against the top edge."
  - id: cut-pauses
    kind: cut
    summary: "Round 1 cuts at 0:47.9–0:50.0 and 1:15.4–1:18.7, taken from gaps in the transcript"
    rule: "WRONG, reverted: both windows contain speech (−24 and −17 dB mean). The transcript had dropped the sentence 'testing on Vibenet is really easy with AI, you just need to add the skills'. The validator now measures audio inside every cut and refuses sound."
  - id: beat-10
    kind: cue
    summary: "Outline on 'Coming soon in Base Cobalt' at 2:11.4 (round 1)"
    rule: "Superseded: the Validity slide now starts on 'Cobalt' and fills the pause; two things at once would split attention."
  - id: cand-tagline-zoom
    kind: cue
    summary: "Zoom on the tagline at 0:22"
    rule: "Largest text on the page, cursor already on it."
  - id: cand-200ms-callout
    kind: cue
    summary: "Callout '200 ms blocks' on the Accounts bullet at 1:46 (round 0 beat 4)"
    rule: "She talks about 200 ms blocks at 0:40, not at 1:46; moved the fact to beat-4 where it is said."
  - id: cand-connect-at-1-06
    kind: cue
    summary: "Connect step-list at 1:06 (round 0 guess)"
    rule: "She says 'point it at Vibenet' at 0:55; moved there (beat-5)."
  - id: cand-tokens-grid-zoom
    kind: cue
    summary: "Zoom on the Tokens feature grid at 2:02"
    rule: "The recorder already zooms there at 1:56–2:00."
  - id: cand-validity-silence-cut
    kind: cut
    summary: "Cut the 6.8s pause at 2:12–2:19"
    rule: "beat-11 (a slide) fills it almost exactly: 5.6s in a 6.7s pause, 0.25s lead. What is left is under the 0.3s minimum cut."
